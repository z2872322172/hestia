# ============================================================================
# test：单元测试与契约测试
# 不连接任何外部基础设施：数据源、Flyway、MyBatis、Redis、RocketMQ、MinIO 全部关闭。
# 需要真实基础设施的测试统一标记 @Tag("integration")，默认 mvn verify 不执行。
# ============================================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  cache:
    type: none

app:
  feature:
    persistence-enabled: false
  security:
    smoke-api-enabled: true
    jwt:
      # 仅用于测试上下文加载：长度满足 HS256 的 32 字节要求，与任何真实环境无关
      secret: test-only-jwt-secret-0123456789-abcdefghij
    # 测试用字段加密密钥，与任何真实环境无关
    field-key: test-only-field-key-0123456789
  outbox:
    relay:
      enabled: false
  rocketmq:
    enabled: false
  storage:
    enabled: false
  map:
    provider: mock

management:
  health:
    redis:
      enabled: false
