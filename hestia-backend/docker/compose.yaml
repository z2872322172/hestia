# ============================================================================
# Hestia 本地基础设施（仅用于开发与答辩演示）
#
# 启动：docker compose -f docker/compose.yaml up -d
# 停止：docker compose -f docker/compose.yaml stop     （保留数据卷）
#
# 说明：
#   1. 镜像使用固定 tag，不使用 latest，避免"今天能跑明天不能跑"；
#   2. 这里的口令是本地开发占位值，生产环境必须由部署平台注入真实密钥；
#   3. 数据卷不随 down 删除，需要清库时显式使用 scripts/dev/reset-infra.ps1 -ConfirmReset。
# ============================================================================
name: hestia-infra

services:
  mysql:
    image: mysql:8.0.40
    container_name: hestia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hestia-root-secret}
      MYSQL_DATABASE: ${DB_NAME:-hestia}
      MYSQL_USER: ${DB_USERNAME:-hestia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hestia-dev-secret}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2.5-alpine
    container_name: hestia-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--save", "60", "1" ]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: hestia-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  # 一次性任务：创建公开桶与私有桶，私有桶不设置匿名访问
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: hestia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_PUBLIC_BUCKET} &&
      mc mb --ignore-existing local/$${MINIO_PRIVATE_BUCKET} &&
      mc anonymous set download local/$${MINIO_PUBLIC_BUCKET} &&
      mc anonymous set none local/$${MINIO_PRIVATE_BUCKET} &&
      echo 'minio buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-housekeeping-dev-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-housekeeping-dev-private}

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.2
    container_name: hestia-rocketmq-nameserver
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_HOST_PORT:-9876}:9876"
    volumes:
      - rocketmq-nameserver-store:/home/rocketmq/namesrv/logs
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/9876' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: hestia-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-nameserver:
        condition: service_started
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    ports:
      - "${ROCKETMQ_BROKER_HA_HOST_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_HOST_PORT:-10911}:10911"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store

  # RocketMQ 5.x gRPC 入口：后端 rocketmq-client-java 连的就是这个端口
  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: hestia-rocketmq-proxy
    restart: unless-stopped
    depends_on:
      rocketmq-broker:
        condition: service_started
    command: sh mqproxy -n rocketmq-nameserver:9876
    ports:
      - "${ROCKETMQ_PROXY_HOST_PORT:-8081}:8081"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  rocketmq-nameserver-store:
  rocketmq-broker-store:
