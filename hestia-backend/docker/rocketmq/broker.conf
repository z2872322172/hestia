# RocketMQ Broker 本地配置
# brokerIP1 必须写成容器名：Proxy 与 Broker 在同一 Docker 网络内互相访问，
# 写 127.0.0.1 会让 Proxy 指向自己，导致客户端发送超时。
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerIP1=rocketmq-broker
namesrvAddr=rocketmq-nameserver:9876

# 本地开发允许自动建 Topic 与订阅组，降低首次启动成本；
# 演示与生产环境应通过 scripts/dev/init-rocketmq.ps1 显式创建。
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 5.x 代理需要读取属性过滤能力
enablePropertyFilter=true
